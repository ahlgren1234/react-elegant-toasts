<!doctype html>
<!-- The theme and direction are static here, so the first paint matches the defaults that
     App.tsx then keeps in sync. They are not persisted across reloads. -->
<html lang="en" dir="ltr" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Accessible, themeable toast notifications for React, ready for right-to-left layouts, keyboards and reduced motion."
    />
    <title>react-elegant-toasts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
