# Dependabot reads this file only from the default branch (main). Until v2 is merged,
# these version updates stay inactive (see V2_PLAN.md, P-06).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major upgrades of deliberately pinned tooling belong to later phases.
      # ESLint 10: blocked by plugin peer ranges (P-05).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Vite, plugin-react and Vitest: evaluated with the demo rebuild (P-04, P-25).
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      # React 19: the React 18/19 matrix (P-23).
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # Pinned exactly to a prerelease (P-04).
      - dependency-name: vitest-axe

  # The packed-package consumer fixture (P-07).
  - package-ecosystem: npm
    directory: /fixtures/consumer-vite
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      consumer-vite:
        update-types: [minor, patch]
    ignore:
      # F1: React 18 and TypeScript 5.0.4, the documented minimum (§24, P-23 D0-5). Each leg's
      # TypeScript is pinned (D0-3), its React major is the leg's, and on TypeScript 5.0 its types
      # stay on versions that declare TypeScript 5.0 support (D0-4).
      - dependency-name: typescript
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'

  # F2: React 19 and TypeScript 5.0.4 (P-23 D0-5).
  - package-ecosystem: npm
    directory: /fixtures/consumer-vite/legs/f2
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      consumer-vite-f2:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'

  # F3: React 18 and TypeScript 7.0.2 (P-23 D0-5).
  - package-ecosystem: npm
    directory: /fixtures/consumer-vite/legs/f3
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      consumer-vite-f3:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']

  # F4: React 19 and TypeScript 7.0.2 (P-23 D0-5).
  - package-ecosystem: npm
    directory: /fixtures/consumer-vite/legs/f4
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      consumer-vite-f4:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
