# Publishes react-elegant-toasts to npm (§29, P-29 S7b-2). It runs only when dispatched on main.
# Mode `dry-run`, the default, runs every gate and a dry run and publishes nothing. Mode `publish`
# publishes only after every gate passes and the maintainer approves the npm-publish Environment.
#
#   preflight → ci (ci.yml, called on this commit) → package (build and pack once; no id-token)
#     → publish (npm-publish Environment; the only job with id-token: write) → verify (after a
#     live publication only)
#
# Inputs reach scripts through `env`, never through the shell. scripts/publish-guard.js holds the
# guards, which use no installed dependency. release-check.test.js checks this file's structure
# against an allowlist, so any change here must change that check too.
name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: every gate and a dry run, nothing published. publish: publish after approval.'
        type: choice
        options: [dry-run, publish]
        default: dry-run
        required: true
      version:
        description: The version in package.json, typed exactly to confirm it.
        type: string
        required: true

permissions: {}

# One run at a time, never cancelled. Not ci.yml's group: ci.yml, called below, takes this
# workflow's name in its own group (`Publish-<ref>`), and sharing that group would deadlock.
concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  # Before any approval: the run, the inputs, main's head and the version, then the release
  # security tests and the publish-mode release check.
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.guard.outputs.dist-tag }}
      previous-latest: ${{ steps.guard.outputs.previous-latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: guard
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
        run: node scripts/publish-guard.js preflight
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/release-check.test.js
      - env:
          DIST_TAG: ${{ steps.guard.outputs.dist-tag }}
        run: node scripts/release-check.js check --mode=publish --tag="$DIST_TAG"

  # The full CI gate on this commit, in this run (§29, item 2).
  ci:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Builds and packs once, checks the tarball and dry-runs it, without id-token.
  package:
    needs: [preflight, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: pack
        env:
          DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
        run: node scripts/release-check.js pack --tag="$DIST_TAG" --out=publish-tarball
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: publish-tarball/
          if-no-files-found: error
          retention-days: 7

  # The only job with id-token and the Environment. It installs nothing and runs no repository
  # build script: it checks the packed tarball, rechecks everything, then dry-runs or publishes it.
  publish:
    needs: [preflight, ci, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: publish-tarball
          digest-mismatch: error
      - id: artifact
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
        run: node scripts/publish-guard.js artifact
      - id: final
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          EXPECTED_DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
        run: node scripts/publish-guard.js final
      - if: inputs.mode == 'dry-run'
        env:
          MODE: ${{ inputs.mode }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          DIST_TAG: ${{ steps.final.outputs.dist-tag }}
        run: node scripts/publish-guard.js dry-run
      - if: inputs.mode == 'publish'
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          DIST_TAG: ${{ steps.final.outputs.dist-tag }}
        run: npm publish "$TARBALL" --tag "$DIST_TAG" --ignore-scripts --access public --provenance

  # After a live publication only: the version, integrity, dist-tags and provenance on npm.
  verify:
    needs: [preflight, package, publish]
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ needs.preflight.outputs.dist-tag }}
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          PREVIOUS_LATEST: ${{ needs.preflight.outputs.previous-latest }}
        run: node scripts/publish-guard.js verify
