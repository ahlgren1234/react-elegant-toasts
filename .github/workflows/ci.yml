name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  # Unit, type, component and axe tests against React 18 and React 19, each with matching types
  # (§25, §28, P-23 D0-1). React 18 is the lockfile; React 19 is installed over it with exact pins.
  test-react:
    name: test (react ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: '18'
            override: ''
            expect: react@18 react-dom@18 @types/react@18 @types/react-dom@18
          - react: '19'
            override: react@19.3.0 react-dom@19.3.0 @types/react@19.3.0 @types/react-dom@19.3.0
            expect: react@19.3.0 react-dom@19.3.0 @types/react@19.3.0 @types/react-dom@19.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.override != ''
        env:
          OVERRIDE: ${{ matrix.override }}
        run: npm install --no-save --ignore-scripts --no-audit --no-fund $OVERRIDE
      # Fails unless exactly the expected React packages are installed, once each.
      - env:
          EXPECT: ${{ matrix.expect }}
        run: node scripts/check-react-versions.js $EXPECT
      - run: npm test
      # Vitest only transpiles, so the type tests are checked against this leg's types here.
      - run: npx tsc -p tsconfig.lib.json
      - run: npx tsc -p tsconfig.test.json

  # The required `test` check (the v2 ruleset). It fails closed: it runs whatever happened to the
  # matrix and passes only when every leg succeeded, never on a failed, cancelled or skipped one.
  test:
    name: test
    needs: test-react
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.test-react.result }}
        run: |
          echo "test-react: $RESULT"
          [ "$RESULT" = success ]

  build-package:
    runs-on: ubuntu-latest
    # The Next.js App Router consumer adds a Next.js build and a Chromium check (P-23 D0-9).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/consumer-vite/package-lock.json
            fixtures/consumer-vite/legs/*/package-lock.json
            fixtures/consumer-next/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Chromium pinned by @playwright/test, and its system packages, for the Next.js consumer check.
      - run: npx playwright install --with-deps chromium
      # Builds, packs and validates the tarball: the packed consumer matrix, F1 to F4, and the
      # Next.js App Router consumer, N1 (§27).
      - run: npm run validate:package

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The browser builds pinned by @playwright/test, and their system packages through apt.
      - run: npx playwright install --with-deps chromium firefox webkit
      # Chromium, Firefox and WebKit, all blocking, with zero retries (§26, P-22).
      - run: npm run test:browser
      # Report, traces and screenshots of the harness page, on failure only.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 7

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:demo
      - run: npm run build:demo
