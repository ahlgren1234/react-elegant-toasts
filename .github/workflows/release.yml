# The release rehearsal (§29, P-28 S3, design B1). It never publishes: no publish job, no
# id-token permission, no npm credentials or secrets, no GitHub release and no environment.
# It runs the release security tests, then scripts/release-check.js validates the release state,
# builds once, packs once, checks the exact tarball contents and runs `npm publish --dry-run`
# (a labelled simulated version while the real version is parked). P-29 owns the live publish job
# and the full CI gate before it. release-check.test.js checks this file's structure against an
# allowlist, so any change here must change that test too. It runs on `main` and `v2` alike, so it
# keeps running across the v2-to-main integration (P-29 S2).
name: Release rehearsal

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  rehearsal:
    name: release rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No registry-url: setup-node would then write an .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/release-check.test.js
      - run: node scripts/release-check.js rehearse
